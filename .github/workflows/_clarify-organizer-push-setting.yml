name: Clarify organizer push setting

on:
  push:
    branches:
      - feature/activity-organizer-history-detail-push

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply wording and regression test
        run: node scripts/_clarify-organizer-push-setting.mjs

      - name: Rebuild hashed assets
        run: npm run build:assets

      - name: Validate activity organizer feature
        run: npm run test:activity-permissions

      - name: Validate web push preferences
        run: npm run test:web-push

      - name: Remove temporary apply files
        run: |
          rm scripts/_clarify-organizer-push-setting.mjs
          rm .github/workflows/_clarify-organizer-push-setting.yml

      - name: Commit clarification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 주최자 변경 푸시 안내 문구 보완"
          git push origin HEAD:feature/activity-organizer-history-detail-push
