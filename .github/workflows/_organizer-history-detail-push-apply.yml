name: Apply organizer history detail push

on:
  push:
    branches:
      - feature/activity-organizer-history-detail-push

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply source changes
        run: node scripts/_apply-organizer-history-detail-push.mjs

      - name: Align existing organizer detail assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "tests/activity-organizer-transfer.test.js";
          const source = await readFile(path, "utf8");
          const from = "/organizerMeta\\(event, organizerAvatarUrl, canTransferOrganizer, participants, root\\)/";
          const to = "/organizerMeta\\(event, organizerAvatarUrl, canTransferOrganizer, participants, root, organizerHistory\\)/";
          if (!source.includes(from)) throw new Error("Legacy organizer detail assertion not found");
          await writeFile(path, source.replace(from, to), "utf8");
          NODE

      - name: Rebuild hashed assets
        run: npm run build:assets

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [[ "$file" == "js/pages/games.js" ]]; then
              continue
            fi
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Validate activity organizer feature
        run: npm run test:activity-permissions

      - name: Validate web push preferences
        run: npm run test:web-push

      - name: Remove temporary apply files
        run: |
          rm scripts/_apply-organizer-history-detail-push.mjs
          rm .github/workflows/_organizer-history-detail-push-apply.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 활동 주최자 변경 내역과 필수 푸시 추가"
          git push origin HEAD:feature/activity-organizer-history-detail-push
