name: Block Tower physics grab verification

on:
  push:
    branches:
      - feature/block-tower-3d-v1

permissions:
  contents: read

jobs:
  physics-grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check Block Tower JavaScript syntax
        run: node --check block-tower/js/app.js
      - name: Smoke test free physics grab in Chromium
        shell: bash
        run: |
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/block-tower-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(error.message));
          await page.goto('http://127.0.0.1:4173/block-tower/', { waitUntil: 'networkidle' });
          await page.locator('#scene canvas').waitFor({ state: 'visible', timeout: 15000 });
          await page.waitForTimeout(1200);

          const canvas = page.locator('#scene canvas');
          const box = await canvas.boundingBox();
          if (!box) throw new Error('Block Tower canvas has no bounding box.');

          let grabPoint = null;
          const xRatios = [0.5, 0.46, 0.54, 0.42, 0.58];
          const yRatios = [0.48, 0.54, 0.6, 0.42, 0.66, 0.36];
          for (const yRatio of yRatios) {
            for (const xRatio of xRatios) {
              const x = box.x + box.width * xRatio;
              const y = box.y + box.height * yRatio;
              await page.mouse.click(x, y);
              const status = await page.locator('#selection-status').textContent();
              if (status && !status.includes('선택된 블록 없음')) {
                grabPoint = { x, y };
                break;
              }
            }
            if (grabPoint) break;
          }
          if (!grabPoint) throw new Error('Could not locate a selectable tower block.');

          await page.mouse.move(grabPoint.x, grabPoint.y);
          await page.mouse.down({ button: 'left' });
          await page.mouse.move(grabPoint.x + 70, grabPoint.y - 55, { steps: 8 });
          await page.waitForTimeout(250);
          const draggingStatus = await page.locator('#selection-status').textContent();
          if (!draggingStatus?.includes('자유 조작 중')) {
            throw new Error(`Physics grab did not activate: ${draggingStatus}`);
          }
          await page.mouse.move(grabPoint.x - 45, grabPoint.y + 40, { steps: 8 });
          await page.waitForTimeout(250);
          await page.mouse.up({ button: 'left' });

          if (pageErrors.length) {
            throw new Error(`Block Tower page errors: ${pageErrors.join(' | ')}`);
          }
          await browser.close();
          NODE
