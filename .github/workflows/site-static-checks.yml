name: Site static checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deterministic build dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild content-hashed community assets
        run: npm run build:assets

      - name: Guard committed hashed assets are current
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- index.html assets/build)" ]]; then
            echo "Committed hashed deployment assets are stale."
            git status --short -- index.html assets/build
            git diff -- index.html assets/build || true
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [[ "$file" == "js/pages/games.js" ]]; then
              continue
            fi
            node --check "$file"
          done < <(find js liar-game/js the-game/js marble-game/js -type f -name '*.js' -print0)

      - name: Test Web Push lifecycle
        run: npm run test:web-push

      - name: Test signup flow
        run: npm run test:signup

      - name: Test admin permissions
        run: npm run test:admin-permissions

      - name: Test activity permissions
        run: npm run test:activity-permissions

      - name: Test The Game rules engine
        run: npm run test:the-game

      - name: Test Marble action recovery
        run: node --test marble-game/tests/onlineActionRecovery.test.js

      - name: Test Marble boot cache
        run: node --test marble-game/tests/onlineBootCache.test.js

      - name: Test Marble active game recovery
        run: node --test marble-game/tests/activeGameRecovery.test.js

      - name: Test Marble multiplayer foundation
        run: node --test marble-game/tests/multiplayerFoundation.test.js

      - name: Test Marble online multiplayer
        run: node --test marble-game/tests/onlineMultiplayer.test.js

      - name: Test Marble online play route diagnostic
        run: node --test marble-game/tests/onlinePlayRouteDiagnostic.test.js

      - name: Test Marble online realtime isolation
        run: node --test marble-game/tests/onlineRealtimeIsolation.test.js

      - name: Test Marble online render isolation
        run: node --test marble-game/tests/onlineRenderIsolation.test.js

      - name: Test Marble online stability
        run: node --test marble-game/tests/onlineStability.test.js

      - name: Test Marble online startup
        run: node --test marble-game/tests/onlineStartup.test.js

      - name: Test Marble play window
        run: node --test marble-game/tests/playWindow.test.js

      - name: Test Marble presence HUD mutation loop
        run: node --test marble-game/tests/presenceHudMutationLoop.test.js

      - name: Test Marble remaining foundation
        run: |
          node --test \
            marble-game/tests/classic.test.js \
            marble-game/tests/diceCharge.test.js \
            marble-game/tests/diceInteractionFlow.test.js \
            marble-game/tests/foundation.test.js \
            marble-game/tests/gameplayHud.test.js \
            marble-game/tests/localPlaytest.test.js \
            marble-game/tests/marbleBootstrap.test.js \
            marble-game/tests/threePrototype.test.js \
            marble-game/tests/tileInfo.test.js \
            marble-game/tests/tollNotice.test.js \
            marble-game/tests/visibilityPolish.test.js

      - name: Guard removed reminder client API
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings "syncUpcomingActivityReminders" js; then
            echo "Removed client reminder API is still referenced."
            exit 1
          fi

      - name: Guard community API boundaries
        run: node scripts/check-community-api-boundaries.mjs

      - name: Link-check community ES modules
        run: node --experimental-vm-modules scripts/check-community-modules.mjs

      - name: Guard community explicit select columns
        run: node scripts/check-community-selects.mjs

      - name: Link-check Liar Game ES modules
        run: node --experimental-vm-modules scripts/check-liar-modules.mjs

      - name: Verify Liar Game canonical SQL baseline
        run: node scripts/build-liar-canonical.mjs --check

      - name: Check site file integrity
        run: node scripts/check-site.mjs
