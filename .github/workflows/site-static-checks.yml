name: Site static checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [[ "$file" == "js/pages/games.js" ]]; then
              continue
            fi
            node --check "$file"
          done < <(find js liar-game/js -type f -name '*.js' -print0)

      - name: Check site file integrity
        run: node scripts/check-site.mjs
