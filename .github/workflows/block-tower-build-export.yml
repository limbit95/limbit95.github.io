name: Block Tower branch verification

on:
  push:
    branches:
      - feature/block-tower-3d-v1

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Check Block Tower JavaScript syntax
        run: node --check block-tower/js/app.js
      - name: Rebuild hashed community assets
        run: npm run build:assets
      - name: Smoke load Block Tower in Chromium
        shell: bash
        run: |
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/block-tower-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(error.message));
          await page.goto('http://127.0.0.1:4173/block-tower/', { waitUntil: 'networkidle' });
          await page.locator('#scene canvas').waitFor({ state: 'visible', timeout: 15000 });
          await page.locator('#loading.is-hidden').waitFor({ state: 'attached', timeout: 15000 });
          if (pageErrors.length) throw new Error(`Block Tower page errors: ${pageErrors.join(' | ')}`);
          await browser.close();
          NODE
      - name: Commit exact generated hashed assets
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- index.html assets/build)" ]]; then
            echo "Hashed assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/build
          git commit -m "build: refresh community hashed assets"
          git push origin HEAD:feature/block-tower-3d-v1
