name: Game Platform governance

on:
  pull_request:
    paths:
      - "games/**"
      - "services/game-platform-vnext/**"
      - "js/**"
      - "css/**"
      - "liar-game/**"
      - "the-game/**"
      - "marble-game/**"
      - "assets/**"
      - "*.[jJ][sS]"
      - "*.[mM][jJ][sS]"
      - "*.[hH][tT][mM][lL]"
      - "*.[cC][sS][sS]"
      - ".nojekyll"
      - "_config.yml"
      - "package.json"
      - "tests/game-platform-*.test.js"
      - "tests/game-platform-vnext-model-oracles.json"
      - "tests/game-db-integration/**"
      - "scripts/check-game-platform-governance.mjs"
      - "scripts/prepare-game-platform-vnext-test-deps.mjs"
      - "scripts/check-game-platform-vnext-boundaries.mjs"
      - "scripts/game-platform-vnext-boundary-rules.mjs"
      - "scripts/build-site-publication.mjs"
      - "scripts/site-publication-files.json"
      - "scripts/check-community-modules.mjs"
      - "scripts/build-community-assets.mjs"
      - "docs/game-platform-*.md"
      - "AGENTS.md"
      - ".github/workflows/game-platform-governance.yml"

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Prepare private Game Platform test dependencies
        id: private-test-deps
        run: node scripts/prepare-game-platform-vnext-test-deps.mjs prepare

      - name: Check Game Platform JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find games -type f -name '*.js' -print0)

      - name: Link-check site modules consuming shared game modules
        run: node --experimental-vm-modules scripts/check-community-modules.mjs

      - name: Test Game Platform contracts
        run: npm run test:game-platform

      - run: npm run build:assets
      - run: git diff --exit-code -- index.html assets/build
      - run: npm run build:publication

      - name: Guard vNext browser-server and static publication boundaries
        run: node scripts/check-game-platform-vnext-boundaries.mjs

      - name: Guard Game Platform boundaries
        run: >-
          node scripts/check-game-platform-governance.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Clean owned private Game Platform test dependencies
        if: ${{ always() && steps.private-test-deps.outputs.owner != '' }}
        env:
          GAME_PLATFORM_TEST_DEPS_OWNER: ${{ steps.private-test-deps.outputs.owner }}
        run: node scripts/prepare-game-platform-vnext-test-deps.mjs cleanup
