name: Rebuild hashed E2E migration

on:
  push:
    branches:
      - feature/rebuild-finalization
    paths:
      - scripts/migrate-hashed-e2e.mjs
      - .github/workflows/rebuild-hashed-e2e-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: feature/rebuild-finalization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch authenticated E2E for hashed assets
        run: node scripts/migrate-hashed-e2e.mjs

      - name: Commit E2E migration
        shell: bash
        run: |
          git add tests/e2e/community-authenticated.spec.js
          if git diff --cached --quiet; then
            echo "Authenticated E2E is already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update E2E for content-hashed bundles"
          git push origin HEAD:feature/rebuild-finalization
