name: Rebuild API facade refactor

on:
  push:
    branches:
      - feature/rebuild-finalization
    paths:
      - scripts/rewrite-community-api-imports.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: feature/rebuild-finalization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rewrite facade imports
        run: node scripts/rewrite-community-api-imports.mjs

      - name: Commit deterministic refactor
        shell: bash
        run: |
          if git diff --quiet -- js; then
            echo "No facade imports required rewriting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js
          git commit -m "Refactor community API facade imports"
          git push origin HEAD:feature/rebuild-finalization
