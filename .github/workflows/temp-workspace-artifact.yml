name: One-shot organizer transfer fixes

on:
  push:
    branches:
      - fix/organizer-transfer-loading-notifications

permissions:
  contents: write

jobs:
  apply-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_one(path, old, new):
              path = root / path
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"replacement anchor not found: {path}: {old[:80]}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          old_migration = root / "supabase/site/migrations/20260915024000_activity_organizer_history_and_push.sql"
          approval_migration = root / "supabase/site/migrations/20260915043318_activity_organizer_history_and_push.sql"
          old_migration.rename(approval_migration)

          history_path = root / "supabase/site/migrations/20260914215312_separate_event_creator_and_organizer_history.sql"
          history = history_path.read_text(encoding="utf-8")
          boundary_start = history.index("create or replace function private.enforce_event_management_boundary()")
          boundary_end = history.index("revoke all on function private.enforce_event_management_boundary()", boundary_start)
          boundary_function = history[boundary_start:boundary_end]
          boundary_anchor = "  v_is_organizer := old.series_id is null and old.organizer_id = v_user_id;"
          transfer_bypass = """  if new.organizer_id is distinct from old.organizer_id
             and v_organizer_transfer_allowed then
            return new;
          end if;

          """.replace("          ", "")
          if boundary_anchor not in boundary_function:
              raise RuntimeError("organizer transfer boundary anchor not found")
          boundary_function = boundary_function.replace(boundary_anchor, transfer_bypass + boundary_anchor, 1)
          (root / "supabase/site/migrations/20260915043650_allow_organizer_transfer_acceptance_boundary.sql").write_text(
              "begin;\n\n" + boundary_function + "commit;\n",
              encoding="utf-8",
          )

          approval = approval_migration.read_text(encoding="utf-8")
          response_start = approval.index("create or replace function public.respond_event_organizer_transfer(")
          response_end = approval.index("create or replace function public.cancel_event_organizer_transfer_request", response_start)
          response_function = approval[response_start:response_end]
          final_notification_start = response_function.rfind("  insert into public.notifications (")
          final_return_start = response_function.index("  return jsonb_build_object(", final_notification_start)
          if final_notification_start == -1 or "event_organizer_transferred" not in response_function[final_notification_start:final_return_start]:
              raise RuntimeError("acceptance notification block not found")
          response_function = response_function[:final_notification_start] + response_function[final_return_start:]
          (root / "supabase/site/migrations/20260915050200_refine_organizer_transfer_notifications.sql").write_text(
              "begin;\n\n" + response_function
              + "revoke all on function public.respond_event_organizer_transfer(bigint, boolean)\n"
              + "from public, anon, authenticated;\n"
              + "grant execute on function public.respond_event_organizer_transfer(bigint, boolean)\n"
              + "to authenticated, service_role;\n\n"
              + "notify pgrst, 'reload schema';\n\ncommit;\n",
              encoding="utf-8",
          )

          replace_one(
              "js/pages/activityDetail.js",
              'import { contentDialog, confirmDialog } from "../components/modal.js";',
              'import { closeModal, contentDialog, confirmDialog } from "../components/modal.js";',
          )
          replace_one(
              "js/pages/activityDetail.js",
              '            setBusy(clickEvent.currentTarget, true, "요청 중…");',
              '            const button = clickEvent.currentTarget;\n            setBusy(button, true, "요청 중…");',
          )
          replace_one(
              "js/pages/activityDetail.js",
              '              await requestEventOrganizerTransfer(event.id, participant.user_id, { leaveCurrent: leaveAfterTransfer });',
              '              await requestEventOrganizerTransfer(event.id, participant.user_id, { leaveCurrent: leaveAfterTransfer });\n              setBusy(button, false);\n              closeModal(true);',
          )
          replace_one(
              "js/pages/activityDetail.js",
              '              showToast(getErrorMessage(error), "error");\n              setBusy(clickEvent.currentTarget, false);',
              '              setBusy(button, false);\n              showToast(getErrorMessage(error), "error");',
          )

          replace_one(
              "css/components.css",
              ".toast-region { position: fixed; z-index: 1500;",
              ".toast-region { position: fixed; z-index: 3100;",
          )

          push_path = root / "supabase/functions/send-web-push/index.ts"
          push = push_path.read_text(encoding="utf-8")
          if push.count('  "event_organizer_transferred",\n') != 2:
              raise RuntimeError("unexpected organizer transferred push references")
          push_path.write_text(push.replace('  "event_organizer_transferred",\n', ""), encoding="utf-8")

          boundary_test = root / "tests/activity-organizer-acceptance-boundary.test.js"
          boundary_test.write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const migration = readFileSync(
            new URL("../supabase/site/migrations/20260915043650_allow_organizer_transfer_acceptance_boundary.sql", import.meta.url),
            "utf8",
          );

          test("accepted organizer transfer bypasses normal ownership check only behind transfer flag", () => {
            assert.match(migration, /new\\.created_by is distinct from old\\.created_by/);
            assert.match(migration, /new\\.organizer_id is distinct from old\\.organizer_id[\\s\\S]*and not v_organizer_transfer_allowed/);
            assert.match(
              migration,
              /if new\\.organizer_id is distinct from old\\.organizer_id[\\s\\S]*and v_organizer_transfer_allowed then[\\s\\S]*return new;/,
            );
            const transferBypass = migration.indexOf("and v_organizer_transfer_allowed then");
            const organizerRoleCheck = migration.indexOf("v_is_organizer :=");
            assert.notEqual(transferBypass, -1);
            assert.notEqual(organizerRoleCheck, -1);
            assert.ok(transferBypass < organizerRoleCheck);
          });
          '''.replace(/^ {10}/gm, ""), encoding="utf-8")

          replace_one(
              "package.json",
              'tests/activity-organizer-transfer.test.js",',
              'tests/activity-organizer-transfer.test.js tests/activity-organizer-acceptance-boundary.test.js",',
          )

          transfer_test_path = root / "tests/activity-organizer-transfer.test.js"
          transfer_test = transfer_test_path.read_text(encoding="utf-8")
          transfer_test = transfer_test.replace(
              "20260915024000_activity_organizer_history_and_push.sql",
              "20260915043318_activity_organizer_history_and_push.sql",
              1,
          )
          transfer_test = transfer_test.replace(
              'const detail = read("../js/pages/activityDetail.js");',
              'const notificationPolicyMigration = read("../supabase/site/migrations/20260915050200_refine_organizer_transfer_notifications.sql");\nconst detail = read("../js/pages/activityDetail.js");',
              1,
          )
          transfer_test = transfer_test.replace(
              '  assert.match(pushFunction, /"event_organizer_transferred"/);',
              '  assert.doesNotMatch(pushFunction, /"event_organizer_transferred"/);',
              1,
          )
          policy_anchor = 'test("leave-after-accept waits for acceptance then cancels previous organizer and promotes waitlist", () => {'
          policy_test = '''test("accepted organizer transfer emits no redundant self notification", () => {
            assert.match(notificationPolicyMigration, /create or replace function public\\.respond_event_organizer_transfer/);
            assert.match(notificationPolicyMigration, /update public\\.events[\\s\\S]*set organizer_id = v_user_id/);
            assert.match(notificationPolicyMigration, /set status = 'accepted'/);
            assert.doesNotMatch(notificationPolicyMigration, /event_organizer_transferred/);
          });

          '''.replace(/^ {10}/gm, "")
          if policy_anchor not in transfer_test:
              raise RuntimeError("notification policy test anchor not found")
          transfer_test = transfer_test.replace(policy_anchor, policy_test + policy_anchor, 1)
          loading_anchor = 'test("activity detail keeps organizer crown and leave-after-accept handoff flow", () => {'
          loading_test = '''test("organizer request closes its modal and releases the global busy state before rerender", () => {
            assert.match(detail, /import \\{ closeModal, contentDialog, confirmDialog \\}/);
            assert.match(
              detail,
              /await requestEventOrganizerTransfer[\\s\\S]*setBusy\\(button, false\\);[\\s\\S]*closeModal\\(true\\);[\\s\\S]*root\\.replaceWith/,
            );
          });

          '''.replace(/^ {10}/gm, "")
          if loading_anchor not in transfer_test:
              raise RuntimeError("busy lifecycle test anchor not found")
          transfer_test_path.write_text(transfer_test.replace(loading_anchor, loading_test + loading_anchor, 1), encoding="utf-8")

          global_loading_path = root / "tests/global-loading-lifecycle.test.js"
          global_loading = global_loading_path.read_text(encoding="utf-8")
          global_loading = global_loading.replace(
              'const ui = readFileSync(new URL("../js/ui.js", import.meta.url), "utf8");',
              'const ui = readFileSync(new URL("../js/ui.js", import.meta.url), "utf8");\nconst components = readFileSync(new URL("../css/components.css", import.meta.url), "utf8");',
              1,
          )
          global_loading += '''

          test("toast progress messages remain above the global loading blur", () => {
            const toastZ = Number(components.match(/\\.toast-region \\{[^}]*z-index:\\s*(\\d+)/s)?.[1]);
            const loadingZ = Number(components.match(/\\.global-loading \\{[^}]*z-index:\\s*(\\d+)/s)?.[1]);
            assert.ok(Number.isFinite(toastZ));
            assert.ok(Number.isFinite(loadingZ));
            assert.ok(toastZ > loadingZ);
          });
          '''.replace(/^ {10}/gm, "")
          global_loading_path.write_text(global_loading, encoding="utf-8")

          Path(".github/workflows/temp-workspace-artifact.yml").unlink(missing_ok=True)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deterministic build dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild content-hashed community assets
        run: npm run build:assets

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [[ "$file" == "js/pages/games.js" ]]; then
              continue
            fi
            node --check "$file"
          done < <(find js liar-game/js the-game/js marble-game/js -type f -name '*.js' -print0)

      - name: Run site validation
        shell: bash
        run: |
          npm run test:web-push
          npm run test:signup
          npm run test:admin-permissions
          npm run test:activity-permissions
          npm run test:the-game
          npm run test:marble
          node scripts/check-community-api-boundaries.mjs
          node --experimental-vm-modules scripts/check-community-modules.mjs
          node scripts/check-community-selects.mjs
          node --experimental-vm-modules scripts/check-liar-modules.mjs
          node scripts/build-liar-canonical.mjs --check
          node scripts/check-site.mjs

      - name: Commit focused changes and rebuilt assets
        shell: bash
        run: |
          git config user.name "limbit95"
          git config user.email "111622452+limbit95@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 주최자 변경 처리와 알림 정책 보정"
          git push origin HEAD:fix/organizer-transfer-loading-notifications
