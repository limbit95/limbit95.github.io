name: One-shot organizer transfer fixes

on:
  push:
    branches:
      - fix/organizer-transfer-loading-notifications

permissions:
  contents: write

jobs:
  apply-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap

          source = subprocess.check_output([
            "git", "show",
            "2a1fe0fecebe6bf5f2b8530270746a828c5fc5e4:.github/workflows/temp-workspace-artifact.yml",
          ], text=True)
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Setup Node.js"
          script = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace('.replace(/^ {10}/gm, "")', '')
          exec(compile(script, "organizer-transfer-one-shot", "exec"))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deterministic build dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild content-hashed community assets
        run: npm run build:assets

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [[ "$file" == "js/pages/games.js" ]]; then
              continue
            fi
            node --check "$file"
          done < <(find js liar-game/js the-game/js marble-game/js -type f -name '*.js' -print0)

      - name: Run site validation
        shell: bash
        run: |
          npm run test:web-push
          npm run test:signup
          npm run test:admin-permissions
          npm run test:activity-permissions
          npm run test:the-game
          npm run test:marble
          node scripts/check-community-api-boundaries.mjs
          node --experimental-vm-modules scripts/check-community-modules.mjs
          node scripts/check-community-selects.mjs
          node --experimental-vm-modules scripts/check-liar-modules.mjs
          node scripts/build-liar-canonical.mjs --check
          node scripts/check-site.mjs

      - name: Commit focused changes and rebuilt assets
        shell: bash
        run: |
          git config user.name "limbit95"
          git config user.email "111622452+limbit95@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 주최자 변경 처리와 알림 정책 보정"
          git push origin HEAD:fix/organizer-transfer-loading-notifications
