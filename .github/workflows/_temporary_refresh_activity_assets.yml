name: Temporary refresh activity assets

on:
  push:
    branches:
      - fix/activity-auto-join-production-regression
    paths:
      - .github/workflows/_temporary_refresh_activity_assets.yml

permissions:
  contents: write

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/activity-auto-join-production-regression
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:assets
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/build
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh community hashed assets"
            git push origin HEAD:fix/activity-auto-join-production-regression
          fi
