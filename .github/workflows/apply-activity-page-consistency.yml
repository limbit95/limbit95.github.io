name: Apply activity page consistency fixes

on:
  push:
    branches:
      - "fix/activity-page-consistency"
    paths:
      - ".github/workflows/apply-activity-page-consistency.yml"

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply scoped source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "js/components/header.js",
              "  actions.append(adminLink, notificationWrap, logoutButton);",
              "  if (adminLink) actions.append(adminLink);\n  actions.append(notificationWrap, logoutButton);",
          )

          replace_once(
              "js/pages/activityDetail.js",
              '''    event.preparation ? el("section", { className: "card page-stack activity-detail__content-card" }, [
                el("h2", { className: "section-title", text: "🎒 준비물" }),
                el("p", { className: "prose", text: event.preparation }),
              ]) : null,
              event.participant_notice ? el("section", { className: "notice-box notice-box--warning" }, [
                el("strong", { text: "참여자 주의사항" }),
                el("p", { className: "prose", text: event.participant_notice }),
              ]) : null,''',
              '''    el("section", { className: "card page-stack activity-detail__content-card" }, [
                el("h2", { className: "section-title", text: "🎒 준비물" }),
                el("p", { className: "prose", text: event.preparation ?? "" }),
              ]),
              el("section", { className: "notice-box notice-box--warning" }, [
                el("strong", { text: "참여자 주의사항" }),
                el("p", { className: "prose", text: event.participant_notice ?? "" }),
              ]),''',
          )

          replace_once(
              "js/pages/activities/calendarView.js",
              '    statuses: ["scheduled", "closed", "completed", "cancelled"],',
              '    statuses: ["scheduled", "closed", "completed"],',
          )

          replace_once(
              "css/pages.css",
              '.activity-card__header { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; padding-left: .35rem; }',
              '''.activity-card__header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: .45rem .8rem;
                align-items: start;
                padding-left: .35rem;
              }
              .activity-card__header > :first-child { display: contents; }
              .activity-card__header .eyebrow { grid-column: 1; grid-row: 1; min-width: 0; }
              .activity-card__title-link { grid-column: 1 / -1; grid-row: 2; min-width: 0; width: 100%; }
              .activity-card__header .status-badge { grid-column: 2; grid-row: 1; justify-self: end; white-space: nowrap; }''',
          )

          replace_once(
              "css/activity-detail.css",
              '''.activity-detail__content-card {
                min-width: 0;
                border-top: 8px solid var(--category-color, rgba(116, 157, 173, .2));
              }''',
              '''.activity-detail__content-card {
                min-width: 0;
                align-content: start;
                border-top: 8px solid var(--category-color, rgba(116, 157, 173, .2));
              }''',
          )

          replace_once(
              "css/activity-detail.css",
              '''.activity-detail__body > .notice-box--warning {
                grid-column: 1;
                min-width: 0;
                display: grid;
                gap: 1rem;
                padding: 1rem;
                border: 1px solid rgba(116, 157, 173, .15);
                border-top: 8px solid var(--category-color, rgba(116, 157, 173, .2));
                border-radius: var(--radius-md);
                background: var(--surface);
                color: var(--ink);
                box-shadow: var(--shadow-sm);
              }

              .activity-detail__body > .notice-box--warning > strong {
                color: var(--forest-900);''',
              '''.activity-detail__body > .notice-box--warning {
                grid-column: 1;
                min-width: 0;
                display: grid;
                gap: 1rem;
                padding: 1rem;
                border: 1px solid #eadcaf;
                border-top: 8px solid var(--yellow-600);
                border-radius: var(--radius-md);
                background: var(--yellow-100);
                color: #654a08;
                box-shadow: var(--shadow-sm);
              }

              .activity-detail__body > .notice-box--warning > strong {
                color: #654a08;''',
          )
          PY

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build content-hashed deployment assets
        run: npm run build:assets

      - name: Check modified JavaScript syntax
        run: |
          node --check js/components/header.js
          node --check js/pages/activityDetail.js
          node --check js/pages/activities/calendarView.js

      - name: Commit source and generated assets
        shell: bash
        run: |
          git rm .github/workflows/apply-activity-page-consistency.yml
          git add js/components/header.js js/pages/activityDetail.js js/pages/activities/calendarView.js css/pages.css css/activity-detail.css package-lock.json index.html assets/build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: 활동 화면 표시와 취소 동작 일관성 개선"
          git push origin HEAD:${GITHUB_REF_NAME}
