name: Community authenticated E2E

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "liar-game/**"
      - "supabase/site/**"
      - "scripts/prepare-e2e-supabase.mjs"
      - "scripts/setup-e2e-member.mjs"
      - "scripts/setup-e2e-community-fixtures.mjs"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/community-authenticated-e2e.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "liar-game/**"
      - "supabase/site/**"
      - "scripts/prepare-e2e-supabase.mjs"
      - "scripts/setup-e2e-member.mjs"
      - "scripts/setup-e2e-community-fixtures.mjs"
      - "tests/e2e/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/community-authenticated-e2e.yml"

jobs:
  authenticated-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      E2E_MEMBER_EMAIL: member.e2e@example.com
      E2E_MEMBER_PASSWORD: Cheongpa-E2E-2026!
      E2E_ADMIN_EMAIL: admin.e2e@example.com
      E2E_ADMIN_PASSWORD: Cheongpa-Admin-E2E-2026!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Discover local Supabase CLI contracts
        run: |
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase status --help >/dev/null

      - name: Initialize isolated Supabase project
        run: |
          rm -rf .e2e-supabase
          mkdir -p .e2e-supabase
          supabase init --workdir .e2e-supabase
          node scripts/prepare-e2e-supabase.mjs

      - name: Start isolated Supabase services
        run: |
          supabase start --workdir .e2e-supabase \
            -x logflare,vector,mailpit,imgproxy,edge-runtime,postgres-meta,studio,supavisor

      - name: Export isolated Supabase credentials
        shell: bash
        run: |
          supabase status --workdir .e2e-supabase -o env > /tmp/cheongpa-e2e-supabase.env
          set -a
          source /tmp/cheongpa-e2e-supabase.env
          set +a
          : "${API_URL:?Missing API_URL from Supabase status}"
          : "${ANON_KEY:?Missing ANON_KEY from Supabase status}"
          : "${SERVICE_ROLE_KEY:?Missing SERVICE_ROLE_KEY from Supabase status}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "E2E_LOCAL_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_LOCAL_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_LOCAL_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Create ephemeral approved member
        env:
          E2E_OUTPUT_ENV_KEY: E2E_MEMBER_USER_ID
        run: node scripts/setup-e2e-member.mjs

      - name: Create ephemeral approved admin
        env:
          E2E_MEMBER_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_MEMBER_ROLE: admin
          E2E_OUTPUT_ENV_KEY: E2E_ADMIN_USER_ID
        run: node scripts/setup-e2e-member.mjs

      - name: Create isolated community fixtures
        run: node scripts/setup-e2e-community-fixtures.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run authenticated community flow
        run: npx playwright test tests/e2e/community-authenticated.spec.js --workers=1

      - name: Upload authenticated E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-authenticated-playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop --workdir .e2e-supabase --no-backup || true
