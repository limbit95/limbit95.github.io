name: Site publication preparation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy prepared static artifact (main only; requires Pages Actions source)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: site-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact_id }}
      artifact_digest: ${{ steps.verify.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:assets
      - name: Require committed generated assets
        run: git diff --exit-code -- index.html assets/build
      - run: node --test tests/game-platform-publication*.test.js
      - run: node scripts/check-game-platform-governance.mjs
      - run: node scripts/check-game-platform-vnext-boundaries.mjs
      - run: npm run build:publication
      - run: npm run check:publication
      - name: Retain source revision and exact file-byte evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-publication-evidence
          path: .site-publication/manifest.json
          if-no-files-found: error
      - name: Package only verified public directory
        id: package
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .site-publication/public
      - name: Verify the uploaded artifact before allowing deployment
        id: verify
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.package.outputs.artifact_id }}
        run: python3 scripts/verify-site-publication-artifact.py
      - name: Retain uploaded artifact verification
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-publication-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .site-publication/artifact-verification.json
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recheck immutable artifact identity immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          PAGES_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
        run: python3 scripts/verify-site-publication-artifact.py --identity-only
      - name: Deploy artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
