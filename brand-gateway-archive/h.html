@keyframes hHeroRise {
  from { opacity: 0; transform: translateY(44px) skewY(3deg); }
  to { opacity: 1; transform: translateY(0) skewY(0); }

@keyframes hHeroSlide {

}

@keyframes hArrow { 50% { transform: translateY(7px); } }
@keyframes hOrbit { to { transform: rotate(360deg); } }
@keyframes hOrbitReverse { to { transform: rotate(-360deg); } }
@keyframes hPulse { 50% { transform: scale(1.04); } }

  .brand-h-header__center,

  .brand-h-hero__caption { max-width: 300px; }
  .brand-h-hero__shape--a { top: 34%; right: -3%; }
  .brand-h-hero__shape--b { left: 54%; bottom: 18%; }
  .brand-h-hero__arrow { width: 44px; height: 44px; right: 18px; bottom: 28px; }
  .brand-h-dock { grid-template-columns: 1fr; }
  .brand-h-dock__item { min-height: 104px; border-right: 0; border-bottom: 1px solid var(--h-line); }
  .brand-h-theatre { height: auto; }
  .brand-h-theatre__sticky { position: relative; height: auto; overflow: visible; }
  .brand-h-theatre__intro { position: relative; left: auto; top: auto; padding: 32px 18px; border-bottom: 1px solid var(--h-line); }
  .brand-h-scenes { position: relative; }
