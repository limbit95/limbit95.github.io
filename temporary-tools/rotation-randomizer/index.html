<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e4f2f7">
    <meta name="description" content="기간과 인원을 입력해 균등한 랜덤 로테이션 계획을 생성합니다.">
    <title>로테이션 랜덤 생성</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="rotation-page">
      <header class="page-header">
        <a class="back-link" href="/">← 청파 같이로 돌아가기</a>
        <p class="eyebrow">TEMPORARY TOOL</p>
        <h1>로테이션 랜덤 생성</h1>
        <p class="description">기간과 참여 인원을 등록하면 날짜별 담당자를 균등하게 랜덤 배정합니다.</p>
      </header>

      <section class="panel" aria-labelledby="period-title">
        <div class="section-heading">
          <span class="step">1</span>
          <div>
            <h2 id="period-title">기간 설정</h2>
            <p>시작일과 종료일을 모두 포함해 하루 단위로 생성합니다.</p>
          </div>
        </div>
        <div class="date-grid">
          <label>
            <span>시작일</span>
            <input id="start-date" type="date" required>
          </label>
          <label>
            <span>종료일</span>
            <input id="end-date" type="date" required>
          </label>
        </div>
      </section>

      <section class="panel" aria-labelledby="people-title">
        <div class="section-heading">
          <span class="step">2</span>
          <div>
            <h2 id="people-title">인원 등록</h2>
            <p>이름을 입력해 로테이션에 참여할 사람을 추가하세요.</p>
          </div>
        </div>
        <form id="person-form" class="person-form">
          <label class="sr-only" for="person-name">참여자 이름</label>
          <input id="person-name" type="text" maxlength="80" autocomplete="off" placeholder="이름 입력 · 쉼표로 여러 명 추가 가능">
          <button class="secondary-button" type="submit">추가</button>
        </form>
        <div class="people-summary">
          <strong>등록 인원 <span id="people-count">0</span>명</strong>
          <button id="clear-people" class="text-button" type="button" hidden>전체 삭제</button>
        </div>
        <ul id="people-list" class="people-list" aria-live="polite"></ul>
        <p id="people-empty" class="empty-message">아직 등록된 인원이 없습니다.</p>
      </section>

      <button id="generate-button" class="primary-button" type="button">로테이션 랜덤 생성</button>
      <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

      <section id="result-section" class="panel result-panel" aria-labelledby="result-title" hidden>
        <div class="result-header">
          <div>
            <p class="eyebrow">RESULT</p>
            <h2 id="result-title">생성된 로테이션</h2>
          </div>
          <button id="regenerate-button" class="secondary-button" type="button">다시 랜덤 생성</button>
        </div>
        <p id="result-summary" class="result-summary"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">날짜</th>
                <th scope="col">담당자</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
        <div id="count-summary" class="count-summary"></div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
