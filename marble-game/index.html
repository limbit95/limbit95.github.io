<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <meta name="description" content="서로 다른 세계와 규칙을 선택해 즐기는 3D 온라인 마블 보드게임">
    <title>Marble Worlds</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body data-theme="classic">
    <main class="marble-shell">
      <header class="marble-header">
        <a class="back-link" href="../#/games">← 게임으로 돌아가기</a>
        <div class="brand-mark" aria-hidden="true">M</div>
        <p class="eyebrow">MARBLE WORLDS</p>
        <h1>어떤 세계로 떠날까요?</h1>
        <p class="intro-copy">
          하나의 마블 엔진 위에서 세계마다 다른 길과 규칙을 경험합니다. 지금은 전체 개발의 첫 단계로 테마와 공통 엔진의 기반을 만들고 있습니다.
        </p>
      </header>

      <section class="theme-section" aria-labelledby="theme-list-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CHOOSE A WORLD</p>
            <h2 id="theme-list-title">테마 선택</h2>
          </div>
          <span class="phase-chip">PHASE 1 · FOUNDATION</span>
        </div>
        <div class="theme-grid" data-theme-grid></div>
      </section>

      <section class="theme-detail" aria-live="polite">
        <div class="theme-detail__heading">
          <div>
            <p class="eyebrow" data-theme-name>CLASSIC</p>
            <h2 data-theme-title>세계일주</h2>
          </div>
          <span class="status-chip" data-theme-status>FOUNDATION</span>
        </div>
        <p class="theme-detail__description" data-theme-description></p>
        <ul class="feature-list" data-theme-features></ul>
        <div class="foundation-note">
          <strong>현재 개발 단계</strong>
          <p data-foundation-note></p>
        </div>
      </section>

      <footer class="marble-footer">
        <p>3D 보드 · 온라인 멀티플레이 · 테마별 고유 규칙은 공통 엔진을 검증한 뒤 차례대로 연결합니다.</p>
      </footer>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
