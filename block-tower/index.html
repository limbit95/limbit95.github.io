<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="3D 물리 기반 블록 타워 게임 프로토타입">
    <title>BLOCK TOWER 3D</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">3D PHYSICS PROTOTYPE</p>
          <h1>BLOCK TOWER</h1>
          <p class="subtitle">블록을 직접 밀고 당기며 타워가 물리적으로 반응하는 모습을 확인해보세요.</p>
        </div>
        <a class="back-link" href="../#/games">게임 목록으로</a>
      </header>

      <section class="stage-card" aria-label="3D 블록 타워">
        <div id="scene" class="scene" role="application" aria-label="3D 블록 타워 화면"></div>
        <div class="hud" aria-live="polite">
          <span class="hud-badge"><strong>54</strong> blocks</span>
          <span id="selection-status" class="hud-badge">선택된 블록 없음</span>
        </div>
        <div class="loading" id="loading">3D 물리 장면을 준비하고 있습니다…</div>
      </section>

      <section class="controls" aria-label="조작 방법">
        <article>
          <span class="control-icon" aria-hidden="true">🖱️</span>
          <div><strong>우클릭 + 드래그</strong><span>타워를 360° 회전</span></div>
        </article>
        <article>
          <span class="control-icon" aria-hidden="true">↕️</span>
          <div><strong>마우스 휠</strong><span>확대 / 축소</span></div>
        </article>
        <article>
          <span class="control-icon" aria-hidden="true">👆</span>
          <div><strong>좌클릭 + 드래그</strong><span>블록의 긴 방향으로 밀기 / 당기기</span></div>
        </article>
      </section>

      <p class="prototype-note">2단계 프로토타입 · Rapier 물리엔진으로 중력·충돌·마찰과 블록 밀기/당기기를 연결했습니다.</p>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
